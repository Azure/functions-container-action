parameters:
- name: pools
  type: object
  default: []

jobs:
  - ${{ each pool in parameters.pools }}:
    - job: Build_And_Test_${{ pool.type }}
      displayName: 'Build and Test ${{ pool.type }}'

      pool:
        name: ${{ pool.name }}
        image: ${{ pool.image }}
        os: ${{ pool.os }}

      templateContext:
        outputParentDirectory: $(Build.ArtifactStagingDirectory)
        outputs:
          - output: pipelineArtifact
            displayName: 'Publish npm debug logs'
            targetPath: $(Build.ArtifactStagingDirectory)/npm-logs
            condition: failed()

      steps:
      - task: npmAuthenticate@0
        inputs:
          workingFile: '.npmrc'
        displayName: 'Authenticate npm'

      - task: Npm@1
        inputs:
          command: 'install'
        displayName: 'Install dependencies'

      - pwsh: |
          $logDir = Join-Path $HOME '.npm/_logs'
          $artifactDir = Join-Path '$(Build.ArtifactStagingDirectory)' 'npm-logs'

          Write-Host "NPM log directory: $logDir"

          if (Test-Path $logDir) {
            New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

            Get-ChildItem $logDir -Filter '*-debug-0.log' |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1 |
              ForEach-Object {
                Copy-Item $_.FullName -Destination $artifactDir -Force
                Write-Host "--- Latest npm debug log: $($_.FullName) ---"
                Get-Content $_.FullName -Tail 200
              }
          } else {
            Write-Host 'No npm log directory was found on the agent.'
          }
        displayName: 'Dump npm debug log on failure'
        condition: failed()

      - task: Npm@1
        inputs:
          command: 'custom'
          customCommand: 'run build'
        displayName: 'Build'

      - task: Npm@1
        inputs:
          command: 'custom'
          customCommand: 'run test'
        displayName: 'Test'